---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_001020 }}
command:
  gpg_crypto_keys:
    title: "RHEL-10-001020 | RHEL 10 must ensure cryptographic verification of vendor software packages."
    exit-status:
      or:
      - 0
      - 1
    timeout: {{ .Vars.timeout_ms }}
    exec: gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-{{ .Vars.rpm_key_file }}
    stdout:
    {{ range .Vars.gpg_key }}
    - '/^uid\s+{{ .name }}/'
    - '/^\s+Key fingerprint = {{ .fingerprint }}/'
    {{ end }}
    meta:
      Cat: 2
      CCI:
      - CCI-003992
      Group_Title:
      - SRG-OS-000366-GPOS-00153
      Rule_ID: SV-280931r1197213_rule
      STIG_ID: RHEL-10-001020
      Vul_ID: V-280931
  {{ end }}
{{ end }}
