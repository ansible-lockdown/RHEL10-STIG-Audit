    - '/usr/sbin/ausearch.*xattrs/'
    - '/usr/sbin/aureport.*xattrs/'
    - '/usr/sbin/autrace.*xattrs/'
    - '/usr/sbin/augenrules.*xattrs/'
    meta:
      Cat: 2
      CCI:
      - CCI-002475
