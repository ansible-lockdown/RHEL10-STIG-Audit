---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_200645 }}
    {{ if not .Vars.rhel10stig_rsyslog_server }}
command:
  rsyslog_encrypt_remote:
    title: "RHEL-10-200645 | RHEL 10 must encrypt the transfer of audit records off-loaded onto a different system or media from the system being audited via rsyslog."
    exec: grep -rE 'tls="on"|StreamDriver.Mode\s*=\s*"1"' /etc/rsyslog.conf /etc/rsyslog.d/
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:tls="on"/'
    meta:
      Cat: 2
      CCI:
      - CCI-001851
      Group_Title:
      - SRG-OS-000342-GPOS-00133
      Rule_ID: SV-280988r1195374_rule
      STIG_ID: RHEL-10-200645
      Vul_ID: V-280988
      NIST800-53R4: AU-4
    {{ end }}
  {{ end }}
{{ end }}
