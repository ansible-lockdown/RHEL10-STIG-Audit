---

{{ if .Vars.rhel_10_200621 }}
  {{ if .Vars.rhel10stig_smartcard_reader }}
command:
  opensc_drivers:
    title: "RHEL-10-200621 | RHEL 10 must use the common access card (CAC) smart card driver."
    exec: opensc-tool --get-conf-entry app:default:card_drivers
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^card_drivers:cac/'
    - '!/^card_drivers:cac$/'
    meta:
      Cat: 2
      CCI:
      - CCI-000764
      - CCI-000766
      - CCI-000765
      - CCI-NA
      Group_Title:
      - SRG-OS-000104-GPOS-00051
      - SRG-OS-000106-GPOS-00053
      - SRG-OS-000107-GPOS-00054
      - SRG-OS-000109-GPOS-00056
      - SRG-OS-000108-GPOS-00055
      Rule_ID: SV-280976r1165283_rule
      STIG_ID: RHEL-10-200621
      Vul_ID: V-280976
      NIST800-53R4: IA-2
  {{ end }}
{{ end }}
