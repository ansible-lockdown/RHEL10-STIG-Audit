---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_200646 }}
    {{ if not .Vars.rhel10stig_rsyslog_server }}
command:
  rsyslog_netstream_driver:
    title: "RHEL-10-200646 | RHEL 10 must encrypt, via the gtls driver, the transfer of audit records off-loaded onto a different system or media from the system being audited via rsyslog."
    exec: grep -rE 'StreamDriver\s*=\s*"(gtls|ossl)"' /etc/rsyslog.conf /etc/rsyslog.d/
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:(gtls|ossl)/'
    meta:
      Cat: 2
      CCI:
      - CCI-001851
      Group_Title:
      - SRG-OS-000342-GPOS-00133
      - SRG-OS-000479-GPOS-00224
      Rule_ID: SV-280989r1197222_rule
      STIG_ID: RHEL-10-200646
      Vul_ID: V-280989
      NIST800-53R4: AU-4
    {{ end }}
  {{ end }}
{{ end }}
