---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_200647 }}
    {{ if not .Vars.rhel10stig_rsyslog_server }}
command:
  rsyslog_monitor_remote:
    title: "RHEL-10-200647 | RHEL 10 must monitor all remote access methods."
    exec: grep -rE '(auth.\*|authpriv.\*|daemon.\*)' /etc/rsyslog.conf /etc/rsyslog.d/
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:auth.*;authpriv.*;daemon.* /var/log/secure/'
    meta:
      Cat: 2
      CCI:
      - CCI-000067
      Group_Title:
      - SRG-OS-000032-GPOS-00013
      Rule_ID: SV-280990r1165325_rule
      STIG_ID: RHEL-10-200647
      Vul_ID: V-280990
      NIST800-53R4: AC-17
    {{ end }}
  {{ end }}
{{ end }}
