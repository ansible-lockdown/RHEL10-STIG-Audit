---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_800240 }}
kernel-param:
  ipv6_all_accept_source_route_live:
    title: "RHEL-10-800240 | RHEL 10 must not forward Internet Protocol version 6 (IPv6) source-routed packets."
    name: net.ipv6.conf.all.accept_source_route
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001111
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00087
      Rule_ID: SV-281356r1167218_rule
      STIG_ID: RHEL-10-800240
      Vul_ID: V-281356
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv6_all_accept_source_route_conf:
    title: "RHEL-10-800240 | RHEL 10 must not forward IPv6 source-routed packets. | conf"
    exec: grep net.ipv6.conf.all.accept_source_route /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv6.conf.all.accept_source_route\s*=\s*0/'
    - '!/^.*conf:net.ipv6.conf.all.accept_source_route\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001111
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00087
      Rule_ID: SV-281357r1167221_rule
      STIG_ID: RHEL-10-800240
      Vul_ID: V-281357
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
