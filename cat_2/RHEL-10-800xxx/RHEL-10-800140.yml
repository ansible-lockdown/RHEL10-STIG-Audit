---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_800140 }}
kernel-param:
  ipv4_def_accpt_redirect_live:
    title: "RHEL-10-800140 | RHEL 10 must prevent Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) redirect messages from being accepted."
    name: net.ipv4.conf.default.accept_redirects
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001101
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00077
      Rule_ID: SV-281346r1197251_rule
      STIG_ID: RHEL-10-800140
      Vul_ID: V-281346
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv4_def_accpt_redirect_conf:
    title: "RHEL-10-800140 | RHEL 10 must prevent Internet Protocol version 4 (IPv4) Internet Control Message Protocol (ICMP) redirect messages from being accepted. | conf"
    exec: grep net.ipv4.conf.default.accept_redirects /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv4.conf.default.accept_redirects\s*=\s*0/'
    - '!/^.*conf:net.ipv4.conf.default.accept_redirects\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001101
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00077
      Rule_ID: SV-281346r1197251_rule
      STIG_ID: RHEL-10-800140
      Vul_ID: V-281346
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
