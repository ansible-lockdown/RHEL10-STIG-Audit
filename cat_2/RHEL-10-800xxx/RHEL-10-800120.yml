---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_800120 }}
kernel-param:
  ipv4_def_martians_live:
    title: "RHEL-10-800120 | RHEL 10 must log Internet Protocol version 4 (IPv4) packets with impossible addresses by default."
    name: net.ipv4.conf.default.log_martians
    value: 1
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001099
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00075
      Rule_ID: SV-281344r1167182_rule
      STIG_ID: RHEL-10-800120
      Vul_ID: V-281344
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv4_def_martians_conf:
    title: "RHEL-10-800120 | RHEL 10 must log Internet Protocol version 4 (IPv4) packets with impossible addresses by default. | conf"
    exec: grep net.ipv4.conf.default.log_martians /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv4.conf.default.log_martians\s*=\s*1/'
    - '!/^.*conf:net.ipv4.conf.default.log_martians\s*=\s*(0|[2-9])/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001099
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00075
      Rule_ID: SV-281344r1167182_rule
      STIG_ID: RHEL-10-800120
      Vul_ID: V-281344
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
