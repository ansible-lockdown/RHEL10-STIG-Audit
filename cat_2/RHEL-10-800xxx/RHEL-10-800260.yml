---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_800260 }}
    {{ if .Vars.rhel10stig_system_uses_ipv6 }}
kernel-param:
  ipv6_def_accept_ra_live:
    title: "RHEL-10-800260 | RHEL 10 must not accept router advertisements on all Internet Protocol version 6 (IPv6) interfaces by default."
    name: net.ipv6.conf.default.accept_ra
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001113
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00089
      Rule_ID: SV-281358r1167224_rule
      STIG_ID: RHEL-10-800260
      Vul_ID: V-281358
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv6_def_accept_ra_conf:
    title: RHEL-10-800260 | RHEL 10 must not accept router advertisements on all IPv6 interfaces by default. | conf
    exec: grep net.ipv6.conf.default.accept_ra /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv6.conf.default.accept_ra\s*=\s*0/'
    - '!/^.*conf:net.ipv6.conf.default.accept_ra\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001113
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00089
      Rule_ID: SV-281358r1167224_rule
      STIG_ID: RHEL-10-800260
      Vul_ID: V-281358
      NIST800-53R4:
      - SC-5
      - SC-7
    {{ end }}
  {{ end }}
{{ end }}
