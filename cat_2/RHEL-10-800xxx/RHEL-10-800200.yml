---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_800200 }}
kernel-param:
  ipv4_conf_send_redirects_default_live:
    title: "RHEL-10-800200 | RHEL 10 must not allow interfaces to perform Internet Control Message Protocol (ICMP) redirects by default."
    name: net.ipv4.conf.default.send_redirects
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001107
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00083
      Rule_ID: SV-281352r1184706_rule
      STIG_ID: RHEL-10-800200
      Vul_ID: V-281352
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv4_conf_send_redirects_default_conf:
    title: "RHEL-10-800200 | RHEL 10 must not allow interfaces to perform Internet Control Message Protocol (ICMP) redirects by default. | conf"
    exec: grep net.ipv4.conf.default.send_redirects /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv4.conf.default.send_redirects\s*=\s*0/'
    - '!/^.*conf:net.ipv4.conf.default.send_redirects\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001107
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00083
      Rule_ID: SV-281352r1184706_rule
      STIG_ID: RHEL-10-800200
      Vul_ID: V-281352
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
