---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_800220 }}
kernel-param:
  ipv6_all_accept_ra_live:
    title: "RHEL-10-800220 | RHEL 10 must not accept router advertisements on all Internet Protocol version 6 (IPv6) interfaces."
    name: net.ipv6.conf.all.accept_ra
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001109
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00085
      Rule_ID: SV-281354r1167212_rule
      STIG_ID: RHEL-10-800220
      Vul_ID: V-281354
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv6_all_accept_ra_conf:
    title: "RHEL-10-800220 | RHEL 10 must not accept router advertisements on all IPv6 interfaces. | conf"
    exec: grep net.ipv6.conf.all.accept_ra /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv6.conf.all.accept_ra\s*=\s*0/'
    - '!/^.*conf:net.ipv6.conf.all.accept_ra\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001109
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00085
      Rule_ID: SV-281354r1167212_rule
      STIG_ID: RHEL-10-800220
      Vul_ID: V-281354
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
