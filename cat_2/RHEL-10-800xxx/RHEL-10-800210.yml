---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_800210 }}
kernel-param:
  ipv4_all_forward_live:
    title: "RHEL-10-800210 | RHEL 10 must not enable Internet Protocol version 4 (IPv4) packet forwarding unless the system is a router."
    name: net.ipv4.conf.all.forwarding
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001108
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00084
      Rule_ID: SV-281353r1167209_rule
      STIG_ID: RHEL-10-800210
      Vul_ID: V-281353
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv4_all_forward_conf:
    title: "RHEL-10-800210 | RHEL 10 must not enable IPv4 packet forwarding unless the system is a router. | conf"
    exec: grep net.ipv4.conf.all.forwarding /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv4.conf.all.forwarding\s*=\s*0/'
    - '!/^.*conf:net.ipv4.conf.all.forwarding\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001108
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00084
      Rule_ID: SV-281353r1167209_rule
      STIG_ID: RHEL-10-800210
      Vul_ID: V-281353
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
