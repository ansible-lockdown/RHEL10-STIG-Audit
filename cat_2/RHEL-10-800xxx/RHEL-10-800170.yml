---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_800170 }}
kernel-param:
  ipv4_icmp_echo_ignore_broadcasts_live:
    title: "RHEL-10-800170 | RHEL 10 must not respond to Internet Control Message Protocol (ICMP) echoes sent to a broadcast address."
    name: net.ipv4.icmp_echo_ignore_broadcasts
    value: 1
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001104
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00080
      Rule_ID: SV-281349r1167197_rule
      STIG_ID: RHEL-10-800170
      Vul_ID: V-281349
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv4_icmp_echo_ignore_broadcasts_conf:
    title: "RHEL-10-800170 | RHEL 10 must not respond to Internet Control Message Protocol (ICMP) echoes sent to a broadcast address. | conf"
    exec: grep net.ipv4.icmp_echo_ignore_broadcasts /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv4.icmp_echo_ignore_broadcasts\s*=\s*1/'
    - '!/^.*conf:net.ipv4.icmp_echo_ignore_broadcasts\s*=\s*(0|[2-9])/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001104
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00080
      Rule_ID: SV-281349r1167197_rule
      STIG_ID: RHEL-10-800170
      Vul_ID: V-281350
      NIST800-53R4:
      - SC-5
      - SC-7
  {{ end }}
{{ end }}
