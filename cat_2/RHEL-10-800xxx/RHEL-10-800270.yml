---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_800270 }}
    {{ if .Vars.rhel10stig_system_uses_ipv6 }}
kernel-param:
  ipv6_def_accept_redirects_live:
    title: "RHEL-10-800270 | RHEL 10 must prevent Internet Protocol version 6 (IPv6) Internet Control Message Protocol (ICMP) redirect messages from being accepted."
    name: net.ipv6.conf.default.accept_redirects
    value: 0
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001114
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00090
      Rule_ID: SV-281359r1167227_rule
      STIG_ID: RHEL-10-800270
      Vul_ID: V-281359
      NIST800-53R4:
      - SC-5
      - SC-7
command:
  ipv6_def_accept_redirects_conf:
    title: "RHEL-10-800270 | RHEL 10 must prevent IPv6 Internet Control Message Protocol (ICMP) redirect messages from being accepted. | conf"
    exec: grep net.ipv6.conf.default.accept_redirects /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:net.ipv6.conf.default.accept_redirects\s*=\s*0/'
    - '!/^.*conf:net.ipv6.conf.default.accept_redirects\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      - CCI-001114
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      - SRG-OS-000142-GPOS-00090
      Rule_ID: SV-281359r1167227_rule
      STIG_ID: RHEL-10-800270
      Vul_ID: V-281359
      NIST800-53R4:
      - SC-5
      - SC-7
    {{ end }}
  {{ end }}
{{ end }}
