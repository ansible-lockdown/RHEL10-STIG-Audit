---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_800060 }}
command:
  dns_name_servers:
    title: "RHEL-10-800060 | RHEL 10 must have at least two name servers configured for systems using Domain Name Server (DNS) resolution."
    exec: r=$(grep -Ei '^nameserver[[:space:]]+' /etc/resolv.conf 2>/dev/null | grep -vcE '127\.0\.0\.53'); s=$(cat /etc/systemd/resolved.conf /etc/systemd/resolved.conf.d/*.conf 2>/dev/null | grep -iE '^[[:space:]]*DNS=' | sed 's/^[^=]*=//' | tr ' ' '\n' | grep -cE '[0-9a-fA-F.:]'); [ "$s" -gt "$r" ] && echo "$s" || echo "$r"
    exit-status: 0
    stdout:
    - '/^([2-9]|[1-9][0-9]+)$/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      Rule_ID: SV-281338r1167164_rule
      STIG_ID: RHEL-10-800060
      Vul_ID: V-281338
      NIST800-53R4: SC-5
  {{ end }}
{{ end }}
