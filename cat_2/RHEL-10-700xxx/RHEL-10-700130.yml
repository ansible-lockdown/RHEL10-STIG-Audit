---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700130 }}
    {{ if not .Vars.rhel10stig_legacy_boot }}
command:
  nosuid_boot_efi:
    title: "RHEL-10-700130 | RHEL 10 must prevent files with the setuid and setgid bit set from being executed on the /boot/efi directory."
    exec: mount -l | grep -E "efi.*nosuid" ||  echo "No EFI found"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(efi.*nosuid|No EFI found)/'
    meta:
      Cat: 2
      CCI:
      - CCI-000213
      Group_Title:
      - SRG-OS-000080-GPOS-00048
      Rule_ID: SV-281234r1166654_rule
      STIG_ID: RHEL-10-700130
      Vul_ID: V-281234
      NIST800-53R4: CM-7
    {{ end }}
  {{ end }}
{{ end }}
