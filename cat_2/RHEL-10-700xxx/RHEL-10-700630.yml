---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700630 }}
command:
  ssh_config_hostbasedauth:
    title: "RHEL-10-700630 | RHEL 10 must not allow a noncertificate trusted host Secure Shell (SSH) login to the system."
    exec: sshd -T | grep -i hostbasedauthentication
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^HostbasedAuthentication no/'
    meta:
      Cat: 2
      CCI:
      - CCI-000213
      Group_Title:
      - SRG-OS-000080-GPOS-00048
      Rule_ID: SV-281266r1184766_rule
      STIG_ID: RHEL-10-700630
      Vul_ID: V-281266
      NIST800-53R4: AC-3
  {{ end }}
{{ end }}
