---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700530 }}
command:
  ssh_config_ignorerhosts:
    title: "RHEL-10-700530 | RHEL 10 must be configured so that the Secure Shell (SSH) daemon does not allow rhosts authentication."
    exec: sshd -T | grep -i ignorerhosts
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^IgnoreRhosts yes/'
    - '!/(?i)^IgnoreRhosts no/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      Rule_ID: SV-281256r1184756_rule
      STIG_ID: RHEL-10-700530
      Vul_ID: V-281256
      NIST800-53R4: SI-6
  {{ end }}
{{ end }}
