---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700400 }}
file:
  selinux_sepolicy:
    title: "RHEL-10-700400 | RHEL 10 must enable the SELinux targeted policy."
    exists: true
    path: /etc/selinux/config
    contents:
    - '/^SELINUXTYPE=targeted/'
    - '!/^SELINUXTYPE=(minimum|mls|permissive)/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      Rule_ID: SV-281249r1197242_rule
      STIG_ID: RHEL-10-700400
      Vul_ID: V-281249
      NIST800-53R4: SI-6
command:
  selinux_getpolicy:
    title: RHEL-10-700400 | RHEL 10 must enable the SELinux targeted policy.
    exec: sestatus | grep "policy name"
    exit-status: 0
    stdout:
    - '/^Loaded policy name:\s+targeted/'
    - '!/^Loaded policy name:\s+(minimum|mls)/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      Rule_ID: SV-258079r958944_rule
      STIG_ID: RHEL-10-700400
      Vul_ID: V-258079
      NIST800-53R4: SI-6
  {{ end }}
{{ end }}
