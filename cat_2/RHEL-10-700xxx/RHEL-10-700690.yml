---

{{ if .Vars.rhel10stig_700690 }}
  {{ if .Vars.rhel10stig_cat2 }}
command:
  shosts_check:
    title: "RHEL-10-700690 | RHEL 10 must not have any .shosts files on the system."
    timeout: {{ .Vars.timeout_ms }}
    exec: find / -name "*.shosts"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000213
      Group_Title:
      - SRG-OS-000080-GPOS-00048
      Rule_ID: SV-281272r1166768_rule
      STIG_ID: RHEL-10-700690
      Vul_ID: V-281272
      NIST800-53R4: CM-6
  {{ end }}
{{ end }}
