{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700820 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_disable_ctrl-alt-del_lock:
    title: "RHEL-10-700820 | RHEL 10 must prevent a user from overriding the Ctrl-Alt-Del sequence settings for the graphical user interface."
    exec: gsettings writable org.gnome.settings-daemon.plugins.media-keys logout
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^false/'
    - '!/^true/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      Rule_ID: SV-281285r1197249_rule
      STIG_ID: RHEL-10-700820
      Vul_ID: V-281285
      NIST800-53R4: CM-6
    {{ end }}
  {{ end }}
{{ end }}
