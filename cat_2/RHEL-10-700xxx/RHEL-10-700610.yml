      or:
      - 0
      - 1
    stdout:
    - '/(?i)^PermitEmptyPasswords no/'
    meta:
      Cat: 2
      CCI:
      - CCI-000766
      Group_Title:
      - SRG-OS-000106-GPOS-00053
      - SRG-OS-000480-GPOS-00229
      Rule_ID: SV-281264r1184764_rule
      STIG_ID: RHEL-10-700610
      Vul_ID: V-281264
