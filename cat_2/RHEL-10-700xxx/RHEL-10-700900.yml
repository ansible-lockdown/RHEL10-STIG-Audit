---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700900 }}
command:
  nxdx_protect_active:
    title: "RHEL-10-700900 | RHEL 10 must implement nonexecutable data to protect its memory from unauthorized code execution."
    exec: dmesg | grep '[NX|DX]*protection'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - 'NX (Execute Disable) protection: active'
    - '!/.*disabled/'
    meta:
      Cat: 2
      CCI:
      - CCI-002824
      Group_Title:
      - SRG-OS-000433-GPOS-00192
      Rule_ID: SV-281293r1166831_rule
      STIG_ID: RHEL-10-700900
      Vul_ID: V-281293
      NIST800-53R4: SI-16
  {{ end }}
{{ end }}
