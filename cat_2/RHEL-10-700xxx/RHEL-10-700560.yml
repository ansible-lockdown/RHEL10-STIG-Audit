---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700560 }}
command:
  ssh_config_strictmodes:
    title: "RHEL-10-700560 | RHEL 10 must be configured so that the Secure Shell (SSH) daemon performs strict mode checking of home directory configuration files."
    exec: sshd -T | grep -i strictmodes
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^StrictModes yes/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      Rule_ID: SV-281259r1184759_rule
      STIG_ID: RHEL-10-700560
      Vul_ID: V-281259
      NIST800-53R4: SI-6
  {{ end }}
{{ end }}
