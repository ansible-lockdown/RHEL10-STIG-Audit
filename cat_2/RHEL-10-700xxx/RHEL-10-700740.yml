---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700740 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_session_lock:
    title: "RHEL-10-700740 | RHEL 10 must prevent a user from overriding the screensaver lock-enabled setting for the graphical user interface."
    exec: gsettings writable org.gnome.desktop.screensaver lock-enabled
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^false/'
    - '!/^true/'
    meta:
      Cat: 2
      CCI:
      - CCI-000056
      - CCI-000057
      Group_Title:
      - SRG-OS-000028-GPOS-00009
      - SRG-OS-000030-GPOS-00011
      Rule_ID: SV-281277r1166783_rule
      STIG_ID: RHEL-10-700740
      Vul_ID: V-281277
      NIST800-53R4: AC-11
    {{ end }}
  {{ end }}
{{ end }}
