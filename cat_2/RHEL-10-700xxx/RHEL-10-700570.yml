---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700570 }}
command:
  ssh_config_lastlog:
    title: "RHEL-10-700570 | RHEL 10 must be configured so that the Secure Shell (SSH) daemon displays the date and time of the last successful account login upon an SSH login."
    exec: sshd -T | grep -i printlastlog
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^PrintLastLog yes/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      Rule_ID: SV-281260r1184760_rule
      STIG_ID: RHEL-10-700570
      Vul_ID: V-281260
      NIST800-53R4: CM-6
  {{ end }}
{{ end }}
