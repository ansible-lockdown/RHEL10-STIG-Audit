    exec: gsettings get org.gnome.settings-daemon.plugins.media-keys logout
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '@as []'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      Rule_ID: SV-281286r1166810_rule
      STIG_ID: RHEL-10-700830
      Vul_ID: V-281286
      NIST800-53R4: SC-5
    {{ end }}
  {{ end }}
{{ end }}
