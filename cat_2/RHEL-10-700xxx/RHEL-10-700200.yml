---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700200 }}
command:
  mounts_missing_nodev:
    title: "RHEL-10-700200 | RHEL 10 must prevent special devices on nonroot local partitions."
    exec: mount | grep '^/dev\S* on /\S' | grep 'nodev' | awk -F " " '{print "MountPoint - " $3 "\tnodev mount option missing"}'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/MountPoint.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001764
      Group_Title:
      - SRG-OS-000368-GPOS-00154
      Rule_ID: SV-281248r1166696_rule
      STIG_ID: RHEL-10-700200
      Vul_ID: V-281248
      NIST800-53R4: CM-7
  {{ end }}
{{ end }}
