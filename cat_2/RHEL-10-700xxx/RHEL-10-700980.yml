---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700980 }}
command:
  get_systemd_confirm_spawn:
    title: "RHEL-10-700980 | RHEL 10 must disable the ability of systemd to spawn an interactive boot process."
    exec: grubby --info=ALL | grep args | grep 'systemd.confirm_spawn'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000381
      Group_Title:
      - SRG-OS-000095-GPOS-00049
      Rule_ID: SV-281300r1167050_rule
      STIG_ID: RHEL-10-700980
      Vul_ID: V-281300
      NIST800-53R4: CM-6
file:
  default_grub_spawn:
    title: RHEL-10-700980 | RHEL 10 must disable the ability of systemd to spawn an interactive boot process. | default grub
    path: /etc/default/grub
    exists: true
    contents:
    - '!/systemd.confirm_spawn=(1|yes|true|on)/'
    meta:
      Cat: 2
      CCI: CCI-000381
      Group_Title:
      - SRG-OS-000095-GPOS-00049
      Rule_ID: SV-281300r1167050_rule
      STIG_ID: RHEL-10-700980
      Vul_ID: V-281300
      NIST800-53R4: CM-6
  {{ end }}
{{ end }}
