---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700620 }}
command:
  ssh_config_permitroot:
    title: "RHEL-10-700620 | RHEL 10 must not permit direct logins to the root account using remote access via Secure Shell (SSH)."
    exec: sshd -T | grep -i permitrootlogin
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^PermitRootLogin no/'
    meta:
      Cat: 2
      CCI:
      - CCI-NA
      Group_Title:
      - SRG-OS-000109-GPOS-00056
      Rule_ID: SV-281265r1184765_rule
      STIG_ID: RHEL-10-700620
      Vul_ID: V-281265
      NIST800-53R4: NA
  {{ end }}
{{ end }}
