---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700510 }}
command:
  ssh_config_gssapiauth:
    title: "RHEL-10-700510 | RHEL 10 must be configured so that the Secure Shell (SSH) daemon does not allow Generic Security Service Application Program Interface (GSSAPI) authentication."
    exec: sshd -T | grep -i gssapiauthentication
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^GSSAPIAuthentication no/'
    meta:
      Cat: 2
      CCI:
      - CCI-001813
      Group_Title:
      - SRG-OS-000364-GPOS-00151
      Rule_ID: SV-281254r1184754_rule
      STIG_ID: RHEL-10-700510
      Vul_ID: V-281254
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
