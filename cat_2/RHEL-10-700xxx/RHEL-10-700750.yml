---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700750 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_screensaver_timeout:
    title: "RHEL-10-700750 | RHEL 10 must automatically lock graphical user sessions after 15 minutes of inactivity."
    exec: gsettings get org.gnome.desktop.session idle-delay
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^uint32 ([1-8][0-9]{1,2}|900)/'
    - '!/^uint32 (0$|90[1-9]|9[1-9][0-9]|[1-9][0-9]{3,})/'
    meta:
      Cat: 2
      CCI:
      - CCI-000057
      - CCI-000060
      Group_Title:
      - SRG-OS-000029-GPOS-00010
      - SRG-OS-000031-GPOS-00012
      Rule_ID: SV-281278r1166786_rule
      STIG_ID: RHEL-10-700750
      Vul_ID: V-281278
      NIST800-53R4: AC-11
    {{ end }}
  {{ end }}
{{ end }}
