---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700520 }}
command:
  ssh_config_kerbauth:
    title: "RHEL-10-700520 | RHEL 10 must be configured so that the Secure Shell (SSH) daemon does not allow Kerberos authentication."
    exec: sshd -T | grep -i kerberosauthentication
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^KerberosAuthentication no/'
    meta:
      Cat: 2
      CCI:
      - CCI-001813
      Group_Title:
      - SRG-OS-000364-GPOS-00151
      Rule_ID: SV-281255r1184755_rule
      STIG_ID: RHEL-10-700520
      Vul_ID: V-281255
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
