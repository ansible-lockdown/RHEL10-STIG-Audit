---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700420 }}
file:
  selinux_enforce:
    title: "RHEL-10-700420 | RHEL 10 must use a Linux Security Module configured to enforce limits on system services."
    exists: true
    path: /etc/selinux/config
    contents:
    - '/(?i)^SELINUX\s*=\s*enforcing/'
    - '!/(?i)^SELINUX\s*=\s*(disabled|permissive).*/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      - CCI-001084
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      - SRG-OS-000134-GPOS-00068
      Rule_ID: SV-281251r1166705_rule
      STIG_ID: RHEL-10-700420
      Vul_ID: V-281251
      NIST800-53R4:
      - SC-3
      - SI-6
command:
  selinux_getenforce:
    title: RHEL-09-431010 | RHEL 10 must use a Linux Security Module configured to enforce limits on system services.
    exec: getenforce
    exit-status: 0
    stdout:
    - '/(?i)^Enforcing/'
    - '!/(?i)^(disabled|permissive)/'
    meta:
      Cat: 1
      CCI:
      - CCI-001084
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      - SRG-OS-000134-GPOS-00068
      Rule_ID: SV-258078r958944_rule
      STIG_ID: RHEL-09-431010
      Vul_ID: V-258078
      NIST800-53R4:
      - SC-3
      - SI-6
  {{ end }}
{{ end }}
