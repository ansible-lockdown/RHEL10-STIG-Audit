---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700880 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_disable_automount:
    title: "RHEL-10-700880 | RHEL 10 must disable the graphical user interface automounter unless required."
    exec: gsettings get org.gnome.desktop.media-handling automount-open
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^false/'
    - '!/^true/'
    meta:
      Cat: 2
      CCI:
      - CCI-000778
      - CCI-001958
      Group_Title:
      - SRG-OS-000114-GPOS-00059
      - SRG-OS-000378-GPOS-00163
      Rule_ID: SV-281291r1166825_rule
      STIG_ID: RHEL-10-700880
      Vul_ID: V-281291
      NIST800-53R4: IA-3
    {{ end }}
  {{ end }}
{{ end }}
