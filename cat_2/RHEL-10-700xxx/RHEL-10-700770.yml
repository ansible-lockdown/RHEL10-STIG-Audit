---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700770 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_screensaver_activate:
    title: "RHEL-10-700770 | RHEL 10 must initiate a session lock for graphical user interfaces when the screensaver is activated."
    exec: gsettings get org.gnome.desktop.screensaver lock-delay
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^uint32 5/'
    - '!/^uint32 (0$|90[1-9]|9[1-9][0-9]|[1-9][0-9]{3,})/'
    meta:
      Cat: 2
      CCI:
      - CCI-000057
      - CCI-000060
      Group_Title:
      - SRG-OS-000029-GPOS-00010
      - SRG-OS-000031-GPOS-00012
      Rule_ID: SV-281280r1166792_rule
      STIG_ID: RHEL-10-700770
      Vul_ID: V-281280
      NIST800-53R4: AC-11
    {{ end }}
  {{ end }}
{{ end }}
