---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700850 }}
command:
  usb-storage_blacklist:
    title: "RHEL-10-700850 | RHEL 10 must be configured to disable USB mass storage."
    exec: grep -r usb-storage /etc/modprobe.conf /etc/modprobe.d/*
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/^.*:install usb-storage \/bin\/false/'
    - '/^.*:blacklist usb-storage/'
    meta:
      Cat: 2
      CCI:
      - CCI-000778
      - CCI-001958
      Group_Title:
      - SRG-OS-000114-GPOS-00059
      - SRG-OS-000370-GPOS-00163
      Rule_ID: SV-281288r1166816_rule
      STIG_ID: RHEL-10-700850
      Vul_ID: V-281288
      NIST800-53R4: IA-3
  {{ end }}
{{ end }}
