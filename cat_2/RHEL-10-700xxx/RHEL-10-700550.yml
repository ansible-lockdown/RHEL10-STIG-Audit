---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700550 }}
command:
  ssh_config_x11forward:
    title: "RHEL-10-700550 | RHEL 10 must be configured so that the Secure Shell (SSH) daemon disables remote X connections for interactive users."
    exec: sshd -T | grep -i x11forwarding
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^X11Forwarding no/'
    - '!/(?i)^X11Forwarding yes/'
    meta:
      Cat: 2
      CCI:
      - CCI-002696
      Group_Title:
      - SRG-OS-000445-GPOS-00199
      Rule_ID: SV-281258r1184758_rule
      STIG_ID: RHEL-10-700550
      Vul_ID: V-281258
      NIST800-53R4: CM-6
  {{ end }}
{{ end }}
