    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^false/'
    - '!/^true/'
    meta:
      Cat: 2
      CCI:
      - CCI-000057
      - CCI-000060
      Group_Title:
      - SRG-OS-000029-GPOS-00010
      - SRG-OS-000031-GPOS-00012
      Rule_ID: SV-281279r1166789_rule
      STIG_ID: RHEL-10-700760
      Vul_ID: V-281279
      NIST800-53R4: AC-11
    {{ end }}
  {{ end }}
{{ end }}
