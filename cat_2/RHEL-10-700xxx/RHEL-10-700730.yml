---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700730 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_smartcard_lock:
    title: "RHEL-10-700730 | RHEL 10 must prevent a user from overriding the disabling of the graphical user smart card removal action."
    exec: gsettings writable org.gnome.settings-daemon.peripherals.smartcard removal-action
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^false/'
    - '!/^true/'
    meta:
      Cat: 2
      CCI:
      - CCI-000056
      - CCI-000057
      Group_Title:
      - SRG-OS-000028-GPOS-00009
      - SRG-OS-000030-GPOS-00011
      Rule_ID: SV-281276r1166780_rule
      STIG_ID: RHEL-10-700730
      Vul_ID: V-281276
      NIST800-53R4: AC-11
    {{ end }}
  {{ end }}
{{ end }}
