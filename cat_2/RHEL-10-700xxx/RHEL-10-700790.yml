---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_700790 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_screensaver_no_pic:
    title: "RHEL-10-700790 | RHEL 10 must conceal, via the session lock, information previously visible on the display with a publicly viewable image."
    exec: gsettings writable org.gnome.desktop.screensaver picture-uri
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^false/'
    - '!/^true/'
    meta:
      Cat: 2
      CCI:
      - CCI-000060
      Group_Title:
      - SRG-OS-000031-GPOS-00012
      Rule_ID: SV-281282r1166798_rule
      STIG_ID: RHEL-10-700790
      Vul_ID: V-281282
      NIST800-53R4: AC-11
  gui_screensaver_no_pic_lock:
    title: RHEL-10-700790 | RHEL 10 must conceal, via the session lock, information previously visible on the display with a publicly viewable image.
    path: /etc/dconf/db/{{ .Vars.rhel10stig_dconf_db }}/locks/00-security-settings-lock
    exists: true
    contents:
    - '/^\/org\/gnome\/desktop\/screensaver\/picture-uri/'
    meta:
      Cat: 2
      CCI:
      - CCI-000060
      Group_Title:
      - SRG-OS-000031-GPOS-00012
      Rule_ID: SV-258027r1045106_rule
      STIG_ID: RHEL-10-700790
      Vul_ID: V-258027
      NIST800-53R4: AC-11
    {{ end }}
  {{ end }}
{{ end }}
