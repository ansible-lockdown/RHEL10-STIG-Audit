---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700700 }}
    {{ if .Vars.rhel10stig_gui }}
command:
  gui_disable_automount_lock:
    title: "RHEL-10-700700 | RHEL 10 must prevent a user from overriding the disabling of the graphical user interface automount function."
    exec: grep 'automount-open' /etc/dconf/db/local.d/locks/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^\/org\/gnome\/desktop\/media-handling\/automount-open/'
    meta:
      Cat: 2
      CCI:
      - CCI-000778
      - CCI-001958
      Group_Title:
      - SRG-OS-000114-GPOS-00059
      - SRG-OS-000378-GPOS-00163
      Rule_ID: SV-281273r1184699_rule
      STIG_ID: RHEL-10-700700
      Vul_ID: V-281273
      NIST800-53R4: IA-3
    {{ end }}
  {{ end }}
{{ end }}
