---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_700410 }}
command:
  elevated_secontext:
    title: "RHEL-10-700410 | RHEL 10 must elevate the SELinux context when an administrator calls the sudo command."
    exec:  grep -r sysadm_r /etc/sudoers /etc/sudoers.d
    exit-status: 0
    stdout:
    - '/^.*:.*ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL/'
    meta:
      Cat: 2
      CCI:
      - CCI-002235
      Group_Title:
      - SRG-OS-000324-GPOS-00125
      Rule_ID: SV-281250r1184704_rule
      STIG_ID: RHEL-10-700410
      Vul_ID: V-281250
      NIST800-53R4: AC-6
  {{ end }}
{{ end }}
