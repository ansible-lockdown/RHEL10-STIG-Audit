---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_400105 }}
command:
  sys_cmds_group:
    title: "RHEL-10-400105 | RHEL 10 must be configured so that system commands are group-owned by root or a system account."
    timeout: {{ .Vars.timeout_ms }}
    exec: find -L /bin /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -gid +999 -exec ls -l {} \;
    exit-status:
      or:
      - 0
      - 1
    stdout:
      - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001499
      Group_Title:
      - SRG-OS-000259-GPOS-00100
      Rule_ID: SV-281038r1184683_rule
      STIG_ID: RHEL-10-400105
      Vul_ID: V-281038
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
