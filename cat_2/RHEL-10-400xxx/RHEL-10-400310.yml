---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_400310 }}
command:
  home_umask_077:
    title: "RHEL-10-400310 | RHEL 10 must set the umask value to 077 for all local interactive user accounts."
    timeout: {{ .Vars.timeout_ms }}
    exec: find /home -maxdepth 2 -type f -name ".[^.]*" -exec grep -iH -d skip --exclude=.bash_history umask {} \;
    exit-status:
      or:
      - 0
      - 1
    stdout:
      or:
      - '/(?i)umask\s*077/'
      - ''
    meta:
      Cat: 2
      CCI:
      - CCI-000213
      Group_Title:
      - SRG-OS-000080-GPOS-00048
      Rule_ID: SV-281079r1165592_rule
      STIG_ID: RHEL-10-400310
      Vul_ID: V-281079
      NIST800-53R4: AC-3
  {{ end }}
{{ end }}
