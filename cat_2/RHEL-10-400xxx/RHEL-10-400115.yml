---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_400115 }}
command:
  lib_files_group:
    title: "RHEL-10-400115 | RHEL 10 must be configured so that library files are group-owned by root or a system account."
    timeout: {{ .Vars.timeout_ms }}
    exec: find -L /lib /lib64 /usr/lib /usr/lib64 -type f -name "*.so*" -gid +999
    exit-status:
      or:
      - 0
      - 1
    stdout:
      - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001499
      Group_Title:
      - SRG-OS-000259-GPOS-00100
      Rule_ID: SV-281040r1184734_rule
      STIG_ID: RHEL-10-400115
      Vul_ID: V-281040
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
