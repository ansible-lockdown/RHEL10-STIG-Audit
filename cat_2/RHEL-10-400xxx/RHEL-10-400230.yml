---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_400230 }}
command:
  crondirs_perms:
    title: "RHEL-10-400230 | RHEL 10 must be configured to prohibit modification of permissions for cron configuration files and directories from the operating system defaults."
    exec: find /etc -type d -name  cron.* ! -perm 755
    exit-status: 0
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000381
      Group_Title:
      - SRG-OS-000095-GPOS-00049
      Rule_ID: SV-281063r1195403_rule
      STIG_ID: RHEL-10-400230
      Vul_ID: V-281063
      NIST800-53R4: CM-6
  cronfiles_perms:
    title: RHEL-10-400230 | RHEL 10 permissions of cron configuration files and directories must not be modified from the operating system defaults.
    exec: for file in /etc/crontab /etc/cron.allow /etc/cron.deny /etc/cron.d/0hourly; do stat -c "%a" $file 2> /dev/null | grep -v 644; done
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI: CCI-000381
      Group_Title: SRG-OS-000095-GPOS-00049
      Rule_ID: SV-281063r1195403_rule
      STIG_ID: RHEL-10-400230
      Vul_ID: V-281063
      NIST800-53R4: CM-6
  {{ end }}
{{ end }}
