---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_400100 }}
command:
  sys_cmds_owner:
    title: "RHEL-10-400100 | RHEL 10 must be configured so that system commands are owned by root."
    timeout: {{ .Vars.timeout_ms }}
    exec: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin ! -user root -exec ls {} \;
    exit-status:
      or:
      - 0
      - 1
    stdout:
      - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001499
      Group_Title:
      - SRG-OS-000259-GPOS-00100
      Rule_ID: SV-281037r1165466_rule
      STIG_ID: RHEL-10-400100
      Vul_ID: V-281037
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
