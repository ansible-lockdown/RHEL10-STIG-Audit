---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_400215 }}
command:
  lib_file_perms:
    title: "RHEL-10-400215 | RHEL 10 must enforce mode 755 or less permissive for library files."
    timeout: {{ .Vars.timeout_ms }}
    exec: find -L /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type f -exec ls -l {} \; | awk '{ print "Permissions Incorrect on " $NF}'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/Permissions Incorrect.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001499
      Group_Title:
      - SRG-OS-000259-GPOS-00100
      Rule_ID: SV-281060r1165535_rule
      STIG_ID: RHEL-10-400215
      Vul_ID: V-281060
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
