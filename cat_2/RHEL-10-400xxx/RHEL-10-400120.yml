---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_400120 }}
command:
  lib_dirs_root_owned:
    title: "RHEL-10-400120 | RHEL 10 must be configured so that library directories are owned by root."
    timeout: {{ .Vars.timeout_ms }}
    exec: find /lib /lib64 /usr/lib /usr/lib64 -type d ! -user root
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001499
      Group_Title:
      - SRG-OS-000259-GPOS-00100
      Rule_ID: SV-281041r1165478_rule
      STIG_ID: RHEL-10-400120
      Vul_ID: V-281041
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
