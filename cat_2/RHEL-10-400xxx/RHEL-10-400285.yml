---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_400285 }}
command:
  all_files_group_owned:
    title: "RHEL-10-400285 | RHEL 10 must be configured so that all local files and directories have a valid group owner."
    timeout: {{ .Vars.timeout_ms }}
    exec: df --local -P | awk {'if (NR!=1) print $6'} |  xargs -I '{}' find "{}" -xdev -nogroup
    exit-status: 0
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000213
      Group_Title:
      - SRG-OS-000080-GPOS-00048
      Rule_ID: SV-281074r1165577_rule
      STIG_ID: RHEL-10-400285
      Vul_ID: V-281074
      NIST800-53R4: AC-3
  {{ end }}
{{ end }}
