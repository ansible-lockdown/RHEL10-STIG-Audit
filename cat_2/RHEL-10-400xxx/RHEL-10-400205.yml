---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_400205 }}
command:
  sys_commands_perms:
    title: "RHEL-10-400205 | RHEL 10 must enforce mode 755 or less permissive for system commands."
    exec: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin -perm /022 -type f -exec ls -l {} \; | awk '{ print "Permissions Incorrect on " $NF }'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/Permissions Incorrect.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-001499
      Group_Title:
      - SRG-OS-000259-GPOS-00100
      Rule_ID: SV-281058r1165529_rule
      STIG_ID: RHEL-10-400205
      Vul_ID: V-281058
      NIST800-53R4: CM-5
  {{ end }}
{{ end }}
