{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_600650 }}
file:
  pam_password_hashing:
    title: "RHEL-10-600650 | RHEL 10 must ensure that the pam_unix.so module is configured in the password-auth file to use a FIPS 140-3-approved cryptographic hashing algorithm for system authentication."
    exists: true
    path: /etc/pam.d/password-auth
    contents:
    - '/^password.*pam_unix.so.*sha512/'
    meta:
      Cat: 2
      CCI:
      - CCI-000803
      Group_Title:
      - SRG-OS-000073-GPOS-00041
      - SRG-OS-000120-GPOS-00061
      Rule_ID: SV-281217r1195450_rule
      STIG_ID: RHEL-10-600650
      Vul_ID: V-281217
      NIST800-53R4: IA-7
  {{ end }}
{{ end }}
