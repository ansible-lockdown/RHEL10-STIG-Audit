    title: "RHEL-10-600100 | RHEL 10 user account passwords for new users or password changes must have a 180-day maximum password lifetime restriction in /etc/login.defs."
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_MAX_DAYS\s+([1-9]|[1-9][0-9]|1[0-7][0-9]|180)\s*$/'
    meta:
      Cat: 2
      CCI:
      - CCI-004066
      Group_Title:
      - SRG-OS-000076-GPOS-00044
      Rule_ID: SV-281169r1273590_rule
      STIG_ID: RHEL-10-600100
