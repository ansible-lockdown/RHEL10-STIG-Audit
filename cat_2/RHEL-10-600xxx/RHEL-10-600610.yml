---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600610 }}
file:
  password-auth_faillock:
    title: "RHEL-10-600610 | RHEL 10 must configure the use of the pam_faillock.so module in the password-auth file."
    exists: true
    path: /etc/pam.d/password-auth
    contents:
    - '/^auth\s+required\s+pam_faillock.so\s+preauth/'
    - '/^auth\s+required\s+pam_faillock.so\s+authfail/'
    - '/^account\s+required\s+pam_faillock.so/'
    meta:
      Cat: 2
      CCI:
      - CCI-000044
      Group_Title:
      - SRG-OS-000021-GPOS-00005
      Rule_ID: SV-281213r1166591_rule
      STIG_ID: RHEL-10-600610
      Vul_ID: V-281213
      NIST800-53R4: AC-7
  {{ end }}
{{ end }}
