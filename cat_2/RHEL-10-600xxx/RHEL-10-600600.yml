---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_600600 }}
file:
  system-auth_faillock:
    title: "RHEL-10-600600 | RHEL 10 must configure the use of the pam_faillock.so module in the system-auth file."
    exists: true
    path: /etc/pam.d/system-auth
    contents:
    - '/^auth\s+required\s+pam_faillock.so\s+preauth/'
    - '/^auth\s+required\s+pam_faillock.so\s+authfail/'
    - '/^account\s+required\s+pam_faillock.so/'
    meta:
      Cat: 2
      CCI:
      - CCI-000044
      Group_Title:
      - SRG-OS-000021-GPOS-00005
      Rule_ID: SV-281212r1166588_rule
      STIG_ID: RHEL-10-600600
      Vul_ID: V-281212
      NIST800-53R4: AC-7
  {{ end }}
{{ end }}
