---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_600000 }}
file:
  grub_superusers:
    title: "RHEL-10-600000 | RHEL 10 must require a boot loader superuser password."
    path: /etc/grub2.cfg
    exists: true
    contents:
    - '/password_pbkdf2\s+{{ .Vars.rhel10stig_grub_superuser }}\s+\${GRUB2_PASSWORD}/'
    meta:
      Cat: 2
      CCI:
      - CCI-000213
      Group_Title:
      - SRG-OS-000080-GPOS-00048
      Rule_ID: SV-281166r1166450_rule
      STIG_ID: RHEL-10-600000
      Vul_ID: V-281166
      NIST800-53R4: AC-3
  grub_users_password:
    title: "RHEL-10-600000 | RHEL 10 must require a boot loader superuser password. | Superuser password set"
    path: /boot/grub2/user.cfg
    exists: true
    contents:
    - '/GRUB2_PASSWORD=grub.pbkdf2.sha512.10000\..*/'
    - '!/GRUB2_PASSWORD=grub.pbkdf2.sha512.changethispassword/'
    meta:
      Cat: 2
      CCI: CCI-000213
      Group_Title: SRG-OS-000080-GPOS-00048
      Rule_ID: SV-257787r1044836_rule
      STIG_ID: RHEL-10-600000
      Vul_ID: V-257787
      NIST800-53R4: AC-3
  {{ end }}
{{ end }}
