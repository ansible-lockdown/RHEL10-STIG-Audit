---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600180 }}
command:
  user_defined homedir_etc_passwd:
    title: "RHEL-10-600180 | RHEL 10 must assign a home directory to all local interactive users in the /etc/passwd file."
    timeout: {{ .Vars.timeout_ms }}
    exec: "awk -F: '($3>=1000)&&($7 !~ /nologin/){print $6}' /etc/passwd"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^\{{ .Vars.rhel10stig_home_filesystem }}/'
    meta:
      Cat: 2
      CCI:
      - CCI-002385
      Group_Title:
      - SRG-OS-000420-GPOS-00186
      Rule_ID: SV-281177r1184748_rule
      STIG_ID: RHEL-10-600180
      Vul_ID: V-281177
      NIST800-53R4: SC-5
  {{ end }}
{{ end }}
