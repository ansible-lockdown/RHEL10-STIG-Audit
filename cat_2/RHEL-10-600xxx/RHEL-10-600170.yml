---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600170 }}
command:
  user_initiate_PATH:
    title: "RHEL-10-600170 | RHEL 10 must be configured so that all local interactive user initialization file executable search path statements do not contain statements that will reference a working directory other than user home directories."
    exec: 'grep -ri "^\s*PATH" {{ .Vars.rhel10stig_home_filesystem }}/*/.[^.]*'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:PATH=\$PATH:\$HOME\/.local\/bin:\$HOME\/bin\s*/'
    meta:
      Cat: 2
      CCI:
      - CCI-003980
      Group_Title:
      - SRG-OS-000362-GPOS-00149
      Rule_ID: SV-281176r1166480_rule
      STIG_ID: RHEL-10-600170
      Vul_ID: V-281176
      NIST800-53R4: NA
  {{ end }}
{{ end }}
