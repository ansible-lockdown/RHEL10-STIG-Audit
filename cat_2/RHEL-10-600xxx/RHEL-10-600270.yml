---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600270 }}
command:
  users_24hr_minpasswd_restrict:
    title: "RHEL-10-600270 | RHEL 10 must enforce that passwords have a 24 hours/1 day minimum lifetime restriction in /etc/shadow."
    exec: "awk -F: '$4 < 1 {print $1 ' ' $4}' /etc/shadow"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-004066
      Group_Title:
      - SRG-OS-000075-GPOS-00043
      Rule_ID: SV-281186r1184622_rule
      STIG_ID: RHEL-10-600270
      Vul_ID: V-281186
      NIST800-53R4: NA
  {{ end }}
{{ end }}
