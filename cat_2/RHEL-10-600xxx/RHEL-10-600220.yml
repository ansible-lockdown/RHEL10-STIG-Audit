---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600220 }}
command:
  pwquality_minlen:
    title: "RHEL-10-600220 | RHEL 10 must enforce that passwords be created with a minimum of 15 characters."
    exec: grep minlen /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/^.*:minlen\s*=\s*(1[5-6]|[2-3][0-9])/'
    - '!/^.*:minlen\s*=\s*([0-9]|1[0-4])$/'
    meta:
      Cat: 2
      CCI:
      - CCI-004066
      Group_Title:
      - SRG-OS-000078-GPOS-00046
      Rule_ID: SV-281181r1195421_rule
      STIG_ID: RHEL-10-600220
      Vul_ID: V-281181
      NIST800-53R4: NA
  {{ end }}
{{ end }}
