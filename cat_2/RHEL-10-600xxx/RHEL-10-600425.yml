---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600425 }}
file:
  faillock_unlock_manual:
    title: "RHEL-10-600425 | RHEL 10 must maintain an account lock until the locked account is released by an administrator."
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^unlock_time\s*=\s*0$/'
    - '!/^unlock_time\s*=\s*[1-9]/'
    meta:
      Cat: 2
      CCI:
      - CCI-002238
      - CCI-000044
      Group_Title:
      - SRG-OS-000329-GPOS-00128
      - SRG-OS-000021-GPOS-00005
      Rule_ID: SV-281197r1166543_rule
      STIG_ID: RHEL-10-600425
      Vul_ID: V-281197
      NIST800-53R4: AC-7
command:
  faillock_unlock_authselect:
    title: RHEL-10-600425 | RHEL 10 must maintain an account lock until the locked account is released by an administrator. | authselect
    exec: authselect current
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^- with-faillock$/'
    meta:
      Cat: 2
      CCI:
      - CCI-000044
      - CCI-002238
      Group_Title:
      - SRG-OS-000329-GPOS-00128
      - SRG-OS-000021-GPOS-00005
      Rule_ID: SV-258057r1045146_rule
      STIG_ID: RHEL-10-600425
      Vul_ID: V-258057
      NIST800-53R4: AC-7
  {{ end }}
{{ end }}
