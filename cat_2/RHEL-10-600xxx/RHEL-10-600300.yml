---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_600300 }}
command:
  pwquality_minclass:
    title: "RHEL-10-600300 | RHEL 10 must require the change of at least four character classes when passwords are changed."
    exec: grep minclass /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/^.*:minclass\s*=\s*[4-9]/'
    - '!/^.*:minclass\s*=\s*(0|[1-3])/'
    meta:
      Cat: 2
      CCI:
      - CCI-NA
      Group_Title:
      - SRG-OS-000072-GPOS-00040
      Rule_ID: SV-281189r1195442_rule
      STIG_ID: RHEL-10-600300
      Vul_ID: V-281189
      NIST800-53R4: NA
  {{ end }}
{{ end }}
