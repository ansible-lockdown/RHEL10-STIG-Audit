---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_600420 }}
file:
  faillock_fail_interval:
    title: "RHEL-10-600420 | RHEL 10 must automatically lock an account when three unsuccessful login attempts occur during a 15-minute time period."
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^fail_interval\s*=\s*([1-9]|9[0-9]|[1-8][0-9]{1,2}|900)$/'
    - '!/^fail_interval\s*=\s*(0|90[1-9]|9[1-9][0-9]|\d{4,})$/'
    meta:
      Cat: 2
      CCI:
      - CCI-002238
      - CCI-000044
      Group_Title:
      - SRG-OS-000329-GPOS-00128
      - SRG-OS-000021-GPOS-00005
      Rule_ID: SV-281196r1166540_rule
      STIG_ID: RHEL-10-600420
      Vul_ID: V-281196
      NIST800-53R4: AC-7
command:
  faillock_fail_authselect:
    title: RHEL-10-600420 | RHEL 10 must automatically lock an account when three unsuccessful logon attempts occur during a 15-minute time period. | authselect
    exec: authselect current
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^- with-faillock/'
    meta:
      Cat: 2
      CCI:
      - CCI-000044
      - CCI-002238
      Group_Title:
      - SRG-OS-000329-GPOS-00128
      - SRG-OS-000021-GPOS-00005
      Rule_ID: SV-258056r1045143_rule
      STIG_ID: RHEL-10-600420
      Vul_ID: V-258056
      NIST800-53R4: AC-7


  {{ end }}
{{ end }}
