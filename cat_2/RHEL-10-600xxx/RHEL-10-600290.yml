---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600290 }}
command:
  pwquality_maxrepeat:
    title: "RHEL-10-600290 | RHEL 10 must require that the maximum number of repeating characters be limited to three when passwords are changed."
    exec: grep maxrepeat /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/^.*:maxrepeat\s*=\s*[1-3]$/'
    - '!/^maxrepeat\s*=\s*(0|[4-9])\d*/'
    meta:
      Cat: 2
      CCI:
      - CCI-004066
      Group_Title:
      - SRG-OS-000072-GPOS-00040
      Rule_ID: SV-281188r1195439_rule
      STIG_ID: RHEL-10-600290
      Vul_ID: V-281188
      NIST800-53R4: NA
  {{ end }}
{{ end }}
