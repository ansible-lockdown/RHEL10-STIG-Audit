---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_600260 }}
command:
  pwquality_difok:
    title: "RHEL-10-600260 | RHEL 10 must require the change of at least eight characters when passwords are changed."
    exec: grep difok /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/^.*:difok\s*=\s*([8-9]|[1-3][0-9])/'
    - '!/^.*:difok\s*=\s*[0-7]/'
    meta:
      Cat: 2
      CCI:
      - CCI-004066
      Group_Title:
      - SRG-OS-000072-GPOS-00040
      Rule_ID: SV-281185r1195433_rule
      STIG_ID: RHEL-10-600260
      Vul_ID: V-281185
      NIST800-53R4: NA
  {{ end }}
{{ end }}
