---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_500620 }}
command:
  audit_conf_init:
    title: "RHEL-10-500620 | RHEL 10 must generate audit records for successful and unsuccessful uses of the init command."
    exec: grep privileged-init /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:-a always,exit -F arch=(b32|b64) -F path=/usr/sbin/init -F perm=x -F auid>=1000 -F auid!=unset -k .*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000477-GPOS-00222
      Rule_ID: SV-281148r1166396_rule
      STIG_ID: RHEL-10-500620
      Vul_ID: V-281148
      NIST800-53R4: AU-12
  audit_running_init:
    title: RHEL-10-500620 | RHEL 10 must generate audit records for successful and unsuccessful uses of the init command.
    exec: auditctl -l | grep -w "init"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=(b32|b64) -S execve -F path=/usr/sbin/init -F perm=x -F auid>=1000 -F auid!=-1 -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000477-GPOS-00222
      Rule_ID: SV-258211r1045418_rule
      STIG_ID: RHEL-10-500620
      Vul_ID: V-258211
      NIST800-53R4: AU-12
  {{ end }}
{{ end }}
