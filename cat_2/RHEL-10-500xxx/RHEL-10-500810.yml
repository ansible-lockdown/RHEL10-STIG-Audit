---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_500810 }}
command:
  audit_conf_rename:
    title: "RHEL-10-500810 | RHEL 10 must generate audit records for all uses of the rename, unlink, rmdir, renameat, and unlinkat system calls."
    exec: grep rename /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:-a always,exit -F arch=b32 -S rename,unlink,rmdir,renameat,renameat2,unlinkat -F auid>=1000 -F auid!=unset -k .*/'
    - '/^.*:-a always,exit -F arch=b64 -S rename,unlink,rmdir,renameat,renameat2,unlinkat -F auid>=1000 -F auid!=unset -k .*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-002884
      - CCI-000172
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000466-GPOS-00210
      - SRG-OS-000467-GPOS-00211
      - SRG-OS-000468-GPOS-00212
      - SRG-OS-000471-GPOS-00215
      Rule_ID: SV-281165r1166447_rule
      STIG_ID: RHEL-10-500810
      Vul_ID: V-281165
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  audit_running_rename:
    title: RHEL-10-500810 | RHEL 10 must generate audit records for all uses of the rename, unlink, rmdir, renameat, and unlinkat system calls.
    exec: auditctl -l | grep rename
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=b32 -S unlink,rename,rmdir,unlinkat,renameat,renameat2 -F auid>=1000 -F auid!=-1 -F key=.*/'
    - '/^-a always,exit -F arch=b64 -S rename,rmdir,unlink,unlinkat,renameat,renameat2 -F auid>=1000 -F auid!=-1 -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-000172
      - CCI-002884
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000466-GPOS-00210
      - SRG-OS-000467-GPOS-00211
      - SRG-OS-000468-GPOS-00212
      - SRG-OS-000471-GPOS-00215
      Rule_ID: SV-258187r1155603_rule
      STIG_ID: RHEL-10-500810
      Vul_ID: V-258187
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  {{ end }}
{{ end }}
