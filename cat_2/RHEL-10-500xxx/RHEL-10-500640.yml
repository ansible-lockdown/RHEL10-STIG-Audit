---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_500640 }}
command:
  audit_conf_reboot:
    title: "RHEL-10-500640 | RHEL 10 must generate audit records for successful and unsuccessful uses of the reboot command."
    exec: grep privileged-reboot /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:-a always,exit -F arch=(b32|b64) -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=unset -k .*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000477-GPOS-00222
      Rule_ID: SV-281150r1166402_rule
      STIG_ID: RHEL-10-500640
      Vul_ID: V-281150
      NIST800-53R4: AU-12
  audit_running_reboot:
    title: RHEL-10-500640 | RHEL 10 must generate audit records for successful and unsuccessful uses of the reboot command.
    exec: auditctl -l | grep -w "reboot"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=(b32|b64) -S execve -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=-1 -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title:
      - SRG-OS-000477-GPOS-00222
      Rule_ID: SV-258213r1045424_rule
      STIG_ID: RHEL-10-500640
      Vul_ID: V-258213
      NIST800-53R4: AU-12
  {{ end }}
{{ end }}
