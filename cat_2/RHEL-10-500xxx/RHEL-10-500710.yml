---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_500710 }}
command:
  audit_conf_etc_gshadow:
    title: "RHEL-10-500710 | RHEL 10 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/gshadow."
    exec: grep identity /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:-a always,exit -F arch=b32 -F path=/etc/gshadow -F perm=wa -F key=.*/'
    - '/^.*:-a always,exit -F arch=b64 -F path=/etc/gshadow -F perm=wa -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000018
      - CCI-000130
      - CCI-000135
      - CCI-000169
