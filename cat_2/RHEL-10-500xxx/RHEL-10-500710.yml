      STIG_ID: RHEL-10-500710
      Vul_ID: V-281157
      NIST800-53R4:
      - AC-2
      - AU-3
      - AU-12
      - MA-4
  audit_running_etc_gshadow:
    title: RHEL-10-500710 | RHEL 10 must generate audit records for all account creations, modifications, disabling, and termination events that affect /etc/gshadow.
    exec: auditctl -l | grep -w "etc/gshadow"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=b32 -S .*,.* -F path=/etc/gshadow -F perm=wa -F key=.*/'
    - '/^-a always,exit -F arch=b64 -S .*,.* -F path=/etc/gshadow -F perm=wa -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000018
