---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_500790 }}
command:
  audit_conf_chown:
    title: "RHEL-10-500790 | RHEL 10 must generate audit records for all uses of the chown, fchown, fchownat, and lchown system calls."
    exec: grep chown /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:-a always,exit -F arch=b32 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k .*/'
    - '/^.*:-a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k .*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-002884
      - CCI-000172
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      - SRG-OS-000064-GPOS-00033
      - SRG-OS-000466-GPOS-00210
      - SRG-OS-000458-GPOS-00203
      - SRG-OS-000474-GPOS-00219
      Rule_ID: SV-281164r1166444_rule
      STIG_ID: RHEL-10-500790
      Vul_ID: V-281164
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  audit_running_chown:
    title: RHEL-10-500790 | RHEL 10 must generate audit records for all uses of the chown, fchown, fchownat, and lchown system calls.
    exec: auditctl -l | grep chown
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat -F auid>=1000 -F auid!=-1 -F key=.*/'
    - '/^-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=-1 -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-000172
      - CCI-002884
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      - SRG-OS-000064-GPOS-00033
      - SRG-OS-000466-GPOS-00210
      - SRG-OS-000458-GPOS-00203
      - SRG-OS-000474-GPOS-00219
      Rule_ID: SV-258178r1155599_rule
      STIG_ID: RHEL-10-500790
      Vul_ID: V-258178
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  {{ end }}
{{ end }}
