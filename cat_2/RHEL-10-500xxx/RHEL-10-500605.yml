---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_500605 }}
command:
  audit_conf_useradd:
    title: "RHEL-10-500605 | RHEL 10 must generate audit records for successful and unsuccessful uses of the useradd command."
    exec: grep privileged-useradd /etc/audit/audit.rules /etc/audit/rules.d/99_auditd.rules /etc/audit/audit.rules.d/audit.rules
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/^.*:-a always,exit -F arch=(b32|b64) -F path=/usr/sbin/useradd -F perm=x -F auid>=1000 -F auid!=unset -k .*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000130
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      - SRG-OS-000466-GPOS-00210
      Rule_ID: SV-288828r1273583_rule
      STIG_ID: RHEL-10-500605
      Vul_ID: V-288828
      NIST800-53R4: AU-3
  audit_running_useradd:
    title: RHEL-10-500605 | RHEL 10 must generate audit records for successful and unsuccessful uses of the useradd command.
    exec: auditctl -l | grep -w "useradd"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=(b32|b64) -S execve -F path=/usr/sbin/useradd -F perm=x -F auid>=1000 -F auid!=-1 -F key=.*/'
    meta:
      Cat: 2
      CCI:
      - CCI-000130
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      - SRG-OS-000466-GPOS-00210
      Rule_ID: SV-288828r1273583_rule
      STIG_ID: RHEL-10-500605
      Vul_ID: V-288828
      NIST800-53R4: AU-3
  {{ end }}
{{ end }}
