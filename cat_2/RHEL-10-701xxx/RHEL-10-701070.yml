---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_701070 }}
kernel-param:
  protect_hardlinks_live:
    title: "RHEL-10-701070 | RHEL 10 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks."
    name: fs.protected_hardlinks
    value: 1
    meta:
      Cat: 2
      CCI:
      - CCI-002165
      - CCI-002235
      Group_Title:
      - SRG-OS-000312-GPOS-00122
      - SRG-OS-000324-GPOS-00125
      Rule_ID: SV-281309r1184631_rule
      STIG_ID: RHEL-10-701070
      Vul_ID: V-281309
      NIST800-53R4:
      - AC-3
      - AC-6
command:
  protect_hardlinks_conf:
    title: RHEL-10-701070 | RHEL 10 must enable kernel parameters to enforce discretionary access control (DAC) on hardlinks. | conf
    exec: grep fs.protected_hardlinks /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:fs.protected_hardlinks\s*=\s*1/'
    - '!/^.*conf:fs.protected_hardlinks\s*=\s*(0|[2-9])/'
    meta:
      Cat: 2
      CCI:
      - CCI-002165
      - CCI-002235
      Group_Title:
      - SRG-OS-000312-GPOS-00123
      - SRG-OS-000324-GPOS-00125
      Rule_ID: SV-281309r1184631_rule
      STIG_ID: RHEL-10-701070
      Vul_ID: V-281309
      NIST800-53R4:
      - AC-3
      - AC-6
  {{ end }}
{{ end }}
