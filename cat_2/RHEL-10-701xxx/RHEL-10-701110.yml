---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_701110 }}
command:
  sctp_blacklist:
    title: "RHEL-10-701110 | RHEL 10 must disable the Stream Control Transmission Protocol (SCTP) kernel module."
    exec: grep -r sctp /etc/modprobe.conf /etc/modprobe.d/*
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/.*:install sctp \/bin\/(false|true)/'
    - '/.*:blacklist sctp/'
    meta:
      Cat: 2
      CCI:
      - CCI-000381
      Group_Title:
      - SRG-OS-000095-GPOS-00049
      Rule_ID: SV-281313r1184770_rule
      STIG_ID: RHEL-10-701110
      Vul_ID: V-281313
      NIST800-53R4: CM-7
  {{ end }}
{{ end }}
