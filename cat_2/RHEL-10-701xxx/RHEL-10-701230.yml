---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel_10_701230 }}
    {{ if .Vars.rhel10stig_smartcard_reader }}
command:
  cert_verification_sssd:
    title: "RHEL-10-701230 | RHEL 10 must implement certificate status checking for multifactor authentication."
    exec: grep -E '^(?i)certificate_verification\s*=\s*ocsp_dgst=sha512$' /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^.*:certificate_verification\s*=\s*ocsp_dgst=sha512$/'
    - '!/(?i)^.*:certificate_verification\s*=\s*[^ocsp_dgst=sha512]/'
    meta:
      Cat: 2
      CCI:
      - CCI-001954
      Group_Title:
      - SRG-OS-000375-GPOS-00160
      - SRG-OS-000377-GPOS-00162
      - SRG-OS-000705-GPOS-00150
      Rule_ID: SV-281325r1184772_rule
      STIG_ID: RHEL-10-701230
      Vul_ID: V-281325
      NIST800-53R4: IA-2
    {{ end }}
  {{ end }}
{{ end }}
