---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_701130 }}
kernel-param:
  aslr_live:
    title: "RHEL-10-701130 | RHEL 10 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code execution."
    name: kernel.randomize_va_space
    value: 2
    meta:
      Cat: 2
      CCI:
      - CCI-002824
      Group_Title:
      - SRG-OS-000433-GPOS-00193
      Rule_ID: SV-281315r1208802_rule
      STIG_ID: RHEL-10-701130
      Vul_ID: V-281315
      NIST800-53R4: SI-16
command:
  aslr_conf:
    title: RHEL-10-701130 | RHEL 10 must implement address space layout randomization (ASLR) to protect its memory from unauthorized code execution.| conf
    exec: grep kernel.randomize_va_space /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:kernel.randomize_va_space\s*=\s*2/'
    - '!/^.*conf:kernel.randomize_va_space\s*=\s*([0-1]|[3-9])/'
    meta:
      Cat: 2
      CCI:
      - CCI-002824
      Group_Title:
      - SRG-OS-000433-GPOS-00193
      Rule_ID: SV-281315r1208802_rule
      STIG_ID: RHEL-10-701130
      Vul_ID: V-281315
      NIST800-53R4: SI-16
  {{ end }}
{{ end }}
