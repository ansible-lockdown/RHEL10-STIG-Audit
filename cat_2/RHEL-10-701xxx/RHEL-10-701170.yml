---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_701170 }}
command:
  user_coredump:
    title: "RHEL-10-701170 | RHEL 10 must disable core dumps for all users."
    exec: if [ "$(sysctl -n kernel.core_pattern 2>/dev/null)" = '|/bin/false' ]; then echo "NA - kernel dumps are disabled as RHEL-10-701090 requires"; else grep -hsE '^[[:blank:]]*[^#[:blank:]]+[[:blank:]]+(hard|soft|-)[[:blank:]]+core([[:blank:]]|$)' /etc/security/limits.conf /etc/security/limits.d/*.conf; fi
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/(^NA - |^[[:blank:]]*\*[[:blank:]]+hard[[:blank:]]+core[[:blank:]]+0[[:blank:]]*$)/'
    - '!/^[[:blank:]]*[^[:blank:]]+[[:blank:]]+(hard|-)[[:blank:]]+core[[:blank:]]+([1-9]|unlimited|infinity)/'
    meta:
      Cat: 2
      CCI:
      - CCI-000381
      Group_Title:
      - SRG-OS-000095-GPOS-00049
      Rule_ID: SV-281319r1184633_rule
      STIG_ID: RHEL-10-701170
      Vul_ID: V-281319
      NIST800-53R4: CM-7
  {{ end }}
{{ end }}
