---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_701080 }}
kernel-param:
  protect_symlinks_live:
    title: "RHEL-10-701080 | RHEL 10 must enable kernel parameters to enforce discretionary access control (DAC) on symlinks."
    name: fs.protected_symlinks
    value: 1
    meta:
      Cat: 2
      CCI:
      - CCI-002165
      - CCI-002235
      Group_Title:
      - SRG-OS-000312-GPOS-00122
      - SRG-OS-000312-GPOS-00123
      - SRG-OS-000324-GPOS-00125
      Rule_ID: SV-281310r1167080_rule
      STIG_ID: RHEL-10-701080
      Vul_ID: V-281310
      NIST800-53R4:
      - AC-3
      - AC-6
command:
  protect_symlinks_conf:
    title: RHEL-10-701080 | RHEL 10 must enable kernel parameters to enforce discretionary access control (DAC) on symlinks. | conf
    exec: grep fs.protected_symlinks /etc/sysctl.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*conf:fs.protected_symlinks\s*=\s*1/'
    - '!/^.*conf:fs.protected_symlinks\s*=\s*(0|[2-9])/'
    meta:
      Cat: 2
      CCI:
      - CCI-002165
      - CCI-002235
      Group_Title:
      - SRG-OS-000312-GPOS-00123
      - SRG-OS-000324-GPOS-00125
      Rule_ID: SV-281310r1167080_rule
      STIG_ID: RHEL-10-701080
      Vul_ID: V-281310
      NIST800-53R4:
      - AC-3
      - AC-6
  {{ end }}
{{ end }}
