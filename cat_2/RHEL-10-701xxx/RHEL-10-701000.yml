---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_701000 }}
command:
  live_grub_page_poison:
    title: "RHEL-10-701000 | RHEL 10 must clear the page allocator to prevent use-after-free attacks."
    exec: grubby --info=ALL | grep args | grep -v 'page_poison=1'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*page_poison/'
    meta:
      Cat: 2
      CCI:
      - CCI-001084
      Group_Title:
      - SRG-OS-000134-GPOS-00068
      Rule_ID: SV-281302r1167056_rule
      STIG_ID: RHEL-10-701000
      Vul_ID: V-281302
      NIST800-53R4: SC-3
file:
  default_grub_page_poison:
    title: RHEL-10-701000 | RHEL 10 must clear the page allocator to prevent use-after-free attacks. | default grub
    path: /etc/default/grub
    exists: true
    contents:
    - '/^GRUB_CMDLINE_LINUX=".*page_poison=1/'
    meta:
      Cat: 2
      CCI:
      - CCI-001084
      Group_Title: SRG-OS-000480-GPOS-00227
      Rule_ID: SV-257793r1044843_rule
      STIG_ID: RHEL-10-701000
      Vul_ID: V-257792
      NIST800-53R4: SC-3
  {{ end }}
{{ end }}
