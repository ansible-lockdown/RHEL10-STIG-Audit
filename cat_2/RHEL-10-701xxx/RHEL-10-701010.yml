---

{{ if .Vars.rhel10stig_cat2 }}
  {{ if .Vars.rhel10stig_701010 }}
command:
  live_grub_slub:
    title: "RHEL-10-701010 | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks."
    exec: grubby --info=ALL | grep args | grep -v 'init_on_free=1'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*init_on_free/'
    meta:
      Cat: 2
      CCI:
      - CCI-001084
      Group_Title:
      - SRG-OS-000134-GPOS-00068
      Rule_ID: SV-281303r1167059_rule
      STIG_ID: RHEL-10-701010
      Vul_ID: V-281303
      NIST800-53R4: SC-3
file:
  default_grub_slub:
    title: RHEL-10-701010 | RHEL 10 must clear memory when it is freed to prevent use-after-free attacks. | default grub
    path: /etc/default/grub
    exists: true
    contents:
    - '/^GRUB_CMDLINE_LINUX=".*init_on_free=1/'
    meta:
      Cat: 2
      CCI:
      - CCI-001084
      Group_Title:
      - SRG-OS-000134-GPOS-00068
      Rule_ID: SV-281303r1167059_rule
      STIG_ID: RHEL-10-701010
      Vul_ID: V-281303
      NIST800-53R4: SC-3
  {{ end }}
{{ end }}
