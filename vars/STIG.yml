#### Variables

### Aide configuration
rhel10stig_use_aide: true
rhel10stig_aide_cron_file: /etc/cron.daily/aide
rhel10stig_aide_cron_day: '*'
rhel10stig_aide_cron_hour: '4'
rhel10stig_aide_cron_minute: '30'
rhel10stig_aide_cron_job: '/usr/sbin/aide --check | /bin/mail -s "$HOSTNAME - Daily aide integrity check run" root@sysname.mil'
rhel10stig_aide_cron_name: 'Aide Job runs Daily at {{ rhel10stig_aide_cron_hour }}:{{ rhel10stig_aide_cron_minute }}'

### Audit configuration
rhel10stig_audit_conf_action_mail_acct: root
rhel10stig_audit_conf_log_group: root

### Authentication configuration
rhel10stig_uses_sssd: false
rhel10stig_smartcard_reader: false

### DConf configuration
rhel10stig_dconf_db: local.d

### Grub configuration
rhel10stig_grub_superuser: root

### ipv6
rhel10stig_system_uses_ipv6: false

### home filesystem
rhel10stig_home_filesystem: /home

### NFS configuration
rhel10stig_nfs_required: false

### Postfix configuration
rhel10stig_postfix_client_conf: permit_mynetworks,reject

### Rsyslog configuration
rhel10stig_rsyslog_server: false
rhel10stig_rsyslog_remote_server_ip: 127.0.0.1
rhel10stig_rsyslog_remote_server_port: 514

rhel10stig_logon_banner:
  - You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
  - By using this IS (which includes any device attached to this IS), you consent to the following conditions
  - -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
  - -At any time, the USG may inspect and seize data stored on this IS.
  - -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
  - -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.
  - -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.

### SSHD settings
rhel10stig_sshd_config_clientalivecountmax: 1
rhel10stig_sshd_config_clientaliveinterval: 600
rhel10stig_sshd_config_gssapiauth: 'no'
rhel10stig_sshd_config_hostauth: 'no'
rhel10stig_sshd_config_ignorerhosts: 'yes'
rhel10stig_sshd_config_kerbauth: 'no'
rhel10stig_sshd_config_loglevel: ENRICHED
rhel10stig_sshd_config_permitroot: 'no'
rhel10stig_sshd_config_rekeylimit: '1G 1h'
rhel10stig_sshd_config_userenv: 'no'
rhel10stig_sshd_config_x11forward: 'no'
rhel10stig_sshd_config_x11uselocal: 'yes'
rhel10stig_sshd_config_ciphers: Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
rhel10stig_sshd_config_macs: MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512


### TFTP server required
# If true, the TFTP server will be configured to operate in secure mode.
rhel10stig_tftp_server_required: false

