---

{{ if .Vars.rhel10stig_cat1 }}
  {{ if .Vars.rhel10stig_700950 }}
command:
  ctrl_alt_del:
    title: "RHEL 10 must disable the systemd Ctrl-Alt-Delete burst key sequence."
    exec: grep -iR CtrlAltDelBurstAction /etc/systemd/
    exit-status: 0
    stdout:
    - '/^.*:CtrlAltDelBurstAction=none/'
    - '!/^.*:CtrlAltDelBurstAction=(reboot.*|poweroff.*)$/'
    meta:
      Cat: 1
      CCI:
      - CCI-002235
      Group_Title:
      - SRG-OS-000324-GPOS-00125
      Rule_ID: SV-281298r1166846_rule
      STIG_ID: RHEL-10-700950
      Vul_ID: V-281298
      NIST800-53R4: AC-6
  {{ end }}
{{ end }}
