---

{{ if .Vars.rhel10stig_cat1 }}
  {{ if .Vars.rhel10stig_300080 }}
command:
  crypto_policies_bind:
    title: "RHEL 10 must implement DOD-approved encryption in the bind package."
    exec: rpm -q bind && grep -i 'include "/etc/crypto-policies/back-ends/bind.config";' /etc/named.conf
    exit-status: 0
    stdout:
    - '/bind-\d*.\d/'
    - '/^\s*include "\/etc\/crypto-policies\/back-ends\/bind.config";/'
    meta:
      Cat: 1
      CCI:
      - CCI-002418
      - CCI-002422
      Group_Title:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000426-GPOS-00190
      Rule_ID: SV-281015r1184783_rule
      STIG_ID: RHEL-10-300080
      Vul_ID: V-281015
      NIST800-53R4: SC-8
  {{ end }}
{{ end }}
