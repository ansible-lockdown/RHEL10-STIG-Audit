---

{{ if .Vars.rhel10stig_cat1 }}
  {{ if .Vars.rhel10stig_300080 }}
command:
  crypto_policies_bind:
    title: "RHEL-10-300080 | RHEL 10 must implement DoW-approved encryption in the bind package."
    exec: if rpm -q bind > /dev/null 2>&1; then grep -i 'include "/etc/crypto-policies/back-ends/bind.config";' /etc/named.conf; else echo bind-not-installed; fi
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(^\s*include "\/etc\/crypto-policies\/back-ends\/bind.config";|^bind-not-installed$)/'
    meta:
      Cat: 1
      CCI:
      - CCI-002418
      - CCI-002422
      Group_Title:
      - SRG-OS-000423-GPOS-00187
      - SRG-OS-000426-GPOS-00190
      Rule_ID: SV-281015r1273573_rule
      STIG_ID: RHEL-10-300080
      Vul_ID: V-281015
      NIST800-53R4: SC-8
  {{ end }}
{{ end }}
