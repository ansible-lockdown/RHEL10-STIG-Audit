---

{{ if .Vars.rhel10stig_cat1 }}
  {{ if .Vars.rhel10stig_000510 }}
package:
  disk_encryption_pkg:
    title: "RHEL 10 must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information on local disk partitions that requires at-rest protection."
    name: cryptsetup
    installed: true
    meta:
      Cat: 1
      CCI:
      - CCI-002476
      - CCI-001199
      - CCI-002475
      Group_Title:
      - SRG-OS-000405-GPOS-00184
      - SRG-OS-000185-GPOS-00079
      - SRG-OS-000404-GPOS-00183
      Rule_ID: SV-280935r1184775_rule
      STIG_ID: RHEL-10-000510
      Vul_ID: V-280935
      NIST800-53R4: SC-28
command:
  check_encrypted_disks:
    title: RHEL-10-000510 | RHEL 10 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure or modification of all information that requires at rest protection. | disks encrypted
    exit-status: 0
    exec: if [ `dmsetup status | awk '{print $NF}' | grep -cv crypt` -ge 1 ] ; then echo "Fail - unencrypted disks"; else echo "OK - System disks encrypted"; fi
    stdout:
    - 'OK - System disks encrypted'
    - '!/Fail - unencrypted disks/'
    meta:
      Cat: 2
      CCI:
      - CCI-001199
      - CCI-002475
      - CCI-002476
      Group_Title:
      - SRG-OS-000405-GPOS-00184
      - SRG-OS-000185-GPOS-00079
      - SRG-OS-000404-GPOS-00183
      Rule_ID: SV-257879r1045454_rule
      STIG_ID: RHEL-10-000510
      Vul_ID: V-257879
      NIST800-53R4: SC-28
  {{ end }}
{{ end }}
