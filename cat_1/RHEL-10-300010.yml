---

{{ if .Vars.rhel10stig_cat1 }}
  {{ if .Vars.rhel10stig_300010 }}
command:
  systemwide_cryptographic_policy:
    title: "RHEL 10 must implement a FIPS 140-3-compliant systemwide cryptographic policy."
    exec: update-crypto-policies --show
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^FIPS/'
    meta:
      Cat: 1
      CCI:
      - CCI-000068
      - CCI-002450
      - CCI-002890
      - CCI-003123
      Group_Title:
      - SRG-OS-000033-GPOS-00014
      - SRG-OS-000396-GPOS-00176
      - SRG-OS-000393-GPOS-00173
      - SRG-OS-000394-GPOS-00174
      Rule_ID: SV-281008r1195401_rule
      STIG_ID: RHEL-10-300010
      Vul_ID: V-281008
      NIST800-53R4:
      - AC-17
      - SC-13
      - MA-4
  {{ end }}
{{ end }}
