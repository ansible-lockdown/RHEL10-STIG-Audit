---

{{ if .Vars.rhel10stig_cat3 }}
  {{ if .Vars.rhel_10_500100 }}
command:
  audit_disk_space_adequate_manual:
    title: "RHEL-10-500100 | RHEL 10 must allocate audit record storage capacity to store at least one week's worth of audit records. | Manual"
    exec: echo -e "MANUAL - Ensure the disk space is sufficient for 1 week of audit logs\n`df -h /var/log/audit`"
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      Cat: 3
      CCI:
      - CCI-001849
      - CCI-001851
      Group_Title:
      - SRG-OS-000341-GPOS-00132
      - SRG-OS-000342-GPOS-00133
      Rule_ID: SV-281106r1166270_rule
      STIG_ID: RHEL-10-500100
      Vul_ID: V-281106
      NIST800-53R4: AU-4
  {{ end }}
{{ end }}

